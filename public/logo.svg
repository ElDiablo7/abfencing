<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A7B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B4FA3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A7DD7;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#6B9FE8;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#4A7DD7;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- AB text -->
  <text x="10" y="68" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="72" fill="url(#blueGrad)" letter-spacing="-3">AB</text>
  
  <!-- Swoosh arc through AB -->
  <path d="M 5 52 Q 70 25 140 52" stroke="url(#swooshGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- FENCING text -->
  <text x="10" y="100" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="800" font-size="40" fill="#1E3A7B" letter-spacing="4">FENCING</text>
</svg>
